[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gs1-inventory-scanner"
version = "0.2.0"
description = "Desktop app for scanning GS1 barcodes into a local inventory database and printing GS1-128 labels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Nearchos Nikolaidis" }]
requires-python = ">=3.10"
dependencies = [
    "biip>=5,<6",
    "reportlab>=4",
]
keywords = ["gs1", "gs1-128", "barcode", "inventory", "warehouse", "sscc", "gtin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gs1-scanner = "gs1_scanner.app:main"

[project.urls]
Repository = "https://github.com/nenikolaidis/gs1-inventory-scanner"
Issues = "https://github.com/nenikolaidis/gs1-inventory-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gs1_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
